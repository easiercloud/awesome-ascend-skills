name: Ascend DMA skill
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'skills/base/ascend-dma-diagnose/**'
      - '.github/workflows/ascend-dma-diagnose.yml'
  pull_request:
    paths:
      - 'skills/base/ascend-dma-diagnose/**'
      - '.github/workflows/ascend-dma-diagnose.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test dependencies (production uses stdlib)
        run: python -m pip install pytest
      - name: Repository validation
        run: python scripts/validate_skills.py
      - name: Protocol, safety, evidence and report tests
        run: python -m pytest skills/base/ascend-dma-diagnose/tests -q
      - name: Offline forward run (no accelerator access)
        run: |
          python skills/base/ascend-dma-diagnose/scripts/dma.py replay --input skills/base/ascend-dma-diagnose/examples/pcie-gen5-pairs.json --out /tmp/ascend-dma-example
          python skills/base/ascend-dma-diagnose/scripts/dma.py report --run /tmp/ascend-dma-example
